name: mkosi-image

on:
  workflow_dispatch:
    inputs:
      arches:
        description: Architectures
        type: choice
        options: [both, x86_64]
        default: both
      arm64_smoke:
        description: Boot smoke test on arm64 (TCG, slow; always on push)
        type: boolean
        default: false
      zstd19:
        description: Measure the zstd -19 size (slow; always on push)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - spike/mkosi/**
      - spike/checks/image/**
      - .github/workflows/mkosi-image.yml

permissions:
  contents: read

concurrency:
  group: mkosi-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # debian:trixie (multi-arch index); mkosi at the version the builder VM
  # (builder.yaml, Debian 13) installs
  DEBIAN_IMAGE: docker.io/library/debian@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
  MKOSI_VERSION: 25.3-7

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.arches == 'x86_64' && '[{"arch":"x86_64","runner":"ubuntu-24.04"}]' || '[{"arch":"x86_64","runner":"ubuntu-24.04"},{"arch":"aarch64","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      ZSTD19: ${{ github.event_name == 'push' || inputs.zstd19 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner
        run: |
          echo "OUT=$RUNNER_TEMP/out" >>"$GITHUB_ENV"
          echo "REPORT=$RUNNER_TEMP/report" >>"$GITHUB_ENV"
          command -v zstd >/dev/null && command -v sfdisk >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd fdisk; }
          uname -a
          nproc; free -h; df -h / "$RUNNER_TEMP"
          ls -l /dev/kvm || echo "no /dev/kvm"
          docker version --format '{{.Server.Version}} {{.Server.Arch}}'

      # build.sh as in the builder VM: the config at /src, outputs in /out,
      # mkosi run as root through sudo, the work tree in ~/w. The work tree and
      # mkosi's workspace (/var/tmp) are host directories, not the container's
      # overlayfs. Privileges: mkosi sets up its own mount namespaces (bind
      # mounts, tmpfs, proc) for every tool it runs, which needs CAP_SYS_ADMIN
      # and the unshare/mount syscalls the default seccomp and AppArmor
      # profiles refuse. No devices: repart builds the image offline, without
      # loop devices.
      - name: Build (spike/mkosi/build.sh in Debian 13)
        run: |
          mkdir -p "$OUT" "$RUNNER_TEMP/w" "$RUNNER_TEMP/vartmp"
          start=$(date +%s)
          docker run --rm \
            --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE/spike/mkosi:/src:ro" -v "$OUT:/out" \
            -v "$RUNNER_TEMP/w:/root/w" -v "$RUNNER_TEMP/vartmp:/var/tmp" \
            -e MKOSI_VERSION \
            "$DEBIAN_IMAGE" bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends "mkosi=$MKOSI_VERSION" \
                systemd-repart systemd-ukify systemd-boot-efi \
                debian-archive-keyring apt dosfstools mtools e2fsprogs erofs-utils cryptsetup-bin \
                squashfs-tools zstd qemu-utils python3-pefile sbsigntool openssl \
                sudo systemd fdisk cpio kmod xz-utils >/dev/null
              mkosi --version | tee /out/mkosi-version
              /src/build.sh --manifest-format=json
              cp /root/w/cpvm.manifest /out/ 2>/dev/null || true
              chown -R "$(stat -c %u:%g /out)" /out
            '
          echo "BUILD_SECONDS=$(($(date +%s) - start))" >>"$GITHUB_ENV"

      - name: Report
        run: |
          mkdir -p "$REPORT"
          cp "$OUT"/dkb/kernel.cmdline "$REPORT"/
          zstd -3 -T0 -q -o "$OUT/cpvm.raw.zst" "$OUT/cpvm.raw"
          if [ "$ZSTD19" = true ]; then
            zst19=$(zstd -19 -T0 -q -c "$OUT/cpvm.raw" | wc -c)
          fi
          (cd "$OUT" && sha256sum cpvm.raw cpvm.raw.zst dkb/*) >"$REPORT/sha256sums.txt"
          file -L "$OUT"/dkb/kernel "$OUT"/dkb/initrd >"$REPORT/kernel-file.txt"
          sfdisk -d "$OUT/cpvm.raw" >"$REPORT/partitions.txt"
          if [ -e "$OUT/cpvm.manifest" ]; then
            cp "$OUT/cpvm.manifest" "$REPORT/"
            jq -r '.packages[] | "\(.name) \(.version) \(.architecture)"' "$OUT/cpvm.manifest" | sort >"$REPORT/packages.txt"
          fi
          raw=$(stat -c %s "$OUT/cpvm.raw"); zst=$(stat -c %s "$OUT/cpvm.raw.zst")
          {
            echo "source: $GITHUB_SHA"
            echo "arch: ${{ matrix.arch }} runner: ${{ matrix.runner }}"
            echo "mkosi: $(cat "$OUT/mkosi-version")"
            echo "roothash: $(tr ' ' '\n' <"$OUT/dkb/kernel.cmdline" | sed -n 's/^roothash=//p')"
            echo "kernel package: $(grep -E '^linux-image-[0-9]' "$REPORT/packages.txt" 2>/dev/null || echo '?')"
            echo "packages: $(wc -l <"$REPORT/packages.txt" 2>/dev/null || echo '?')"
            echo "build_seconds: $BUILD_SECONDS"
            echo "partition types: $(sed -n 's/.*type=\([0-9A-F-]*\).*name="\([^"]*\)".*/\2=\1/p' "$REPORT/partitions.txt" | tr '\n' ' ')"
          } >"$REPORT/MANIFEST"
          mib() { echo "$(( ($1 + 524288) / 1048576 )) MiB"; }
          {
            echo "## ${{ matrix.arch }} on ${{ matrix.runner }}"
            echo
            echo "build (container start to outputs): ${BUILD_SECONDS} s"
            echo
            echo "| | bytes | |"
            echo "|---|---|---|"
            echo "| cpvm.raw | $raw | $(mib "$raw") |"
            echo "| cpvm.raw.zst (-3, the artifact) | $zst | $(mib "$zst") |"
            [ -z "${zst19:-}" ] || echo "| zstd -19 | $zst19 | $(mib "$zst19") |"
            echo "| dkb/kernel | $(stat -c %s "$OUT/dkb/kernel") | |"
            echo "| dkb/initrd | $(stat -c %s "$OUT/dkb/initrd") | |"
            echo
            echo '```'; cat "$REPORT/MANIFEST"; echo; cat "$REPORT/sha256sums.txt"; echo; cat "$REPORT/kernel-file.txt"; echo '```'
            echo
            echo "<details><summary>packages</summary>"
            echo
            echo '```'; cat "$REPORT/packages.txt" 2>/dev/null || echo "no manifest"; echo '```'
            echo "</details>"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mkosi-report-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mkosi-image-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/out/cpvm.raw.zst
            ${{ runner.temp }}/out/dkb/
          retention-days: 3
          compression-level: 0

      # Direct kernel boot as Lima does it, with a minimal cidata and no
      # state disk (spike/checks/image/smoke.sh); then the same boot of
      # copies with 1 MiB of the verity data overwritten, which must panic.
      - name: Boot smoke test
        if: matrix.arch == 'x86_64' || github.event_name == 'push' || inputs.arm64_smoke
        continue-on-error: true
        timeout-minutes: 20
        env:
          # arm64 under TCG with the cidata: dockerd never reported started
          # within 900 s (2 runs of 2); without it, it does
          SMOKE_CIDATA: ${{ matrix.arch == 'x86_64' && '1' || '0' }}
        run: |
          spike/checks/image/qemu-host.sh
          rc=0
          spike/checks/image/smoke.sh mkosi "$OUT" "$REPORT" || rc=1
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            for w in start mid; do spike/checks/image/smoke.sh mkosi "$OUT" "$REPORT" $w || rc=1; done
          fi
          exit $rc

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mkosi-boot-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report/serial-*.log
          if-no-files-found: ignore
