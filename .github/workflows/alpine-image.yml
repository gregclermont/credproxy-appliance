name: alpine-image

on:
  workflow_dispatch:
    inputs:
      arches:
        description: Architectures
        type: choice
        options: [both, x86_64]
        default: both
      arm64_smoke:
        description: Boot smoke test on arm64 (TCG, slow; always on push)
        type: boolean
        default: false
      zstd19:
        description: Measure the zstd -19 size (slow; always on push)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - spike/alpine/**
      - spike/checks/image/**
      - .github/workflows/alpine-image.yml

permissions:
  contents: read

concurrency:
  group: alpine-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.arches == 'x86_64' && '[{"arch":"x86_64","runner":"ubuntu-24.04"}]' || '[{"arch":"x86_64","runner":"ubuntu-24.04"},{"arch":"aarch64","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ZSTD19: ${{ github.event_name == 'push' || inputs.zstd19 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner
        run: |
          echo "OUT=$RUNNER_TEMP/out/ci" >>"$GITHUB_ENV"
          echo "REPORT=$RUNNER_TEMP/report" >>"$GITHUB_ENV"
          command -v zstd >/dev/null && command -v sfdisk >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd fdisk; }
          uname -a
          nproc; free -h; df -h / "$RUNNER_TEMP"
          ls -l /dev/kvm || echo "no /dev/kvm"
          docker version --format '{{.Server.Version}} {{.Server.Arch}}'

      # The variant measured end to end: Alpine's Docker, Lima's needs, dm-verity.
      - name: Build (spike/alpine/build.sh ci apk lima ctrd verity)
        env:
          CPVM_ENGINE: docker
        run: |
          OUT=$RUNNER_TEMP/out spike/alpine/build.sh ci apk lima ctrd verity

      - name: Report
        run: |
          mkdir -p "$REPORT"
          cp "$OUT"/MANIFEST "$OUT"/packages.txt "$OUT"/initramfs-modules.txt "$OUT"/dkb/kernel.cmdline "$REPORT"/
          zstd -3 -T0 -q -o "$OUT/cpvm.raw.zst" "$OUT/cpvm.raw"
          if [ "$ZSTD19" = true ]; then
            zst19=$(zstd -19 -T0 -q -c "$OUT/cpvm.raw" | wc -c)
          fi
          (cd "$OUT" && sha256sum cpvm.raw cpvm.raw.zst dkb/*) >"$REPORT/sha256sums.txt"
          file -L "$OUT"/dkb/kernel "$OUT"/dkb/initrd >"$REPORT/kernel-file.txt"
          sfdisk -d "$OUT/cpvm.raw" >"$REPORT/partitions.txt"
          raw=$(stat -c %s "$OUT/cpvm.raw"); zst=$(stat -c %s "$OUT/cpvm.raw.zst")
          mib() { echo "$(( ($1 + 524288) / 1048576 )) MiB"; }
          {
            echo "## ${{ matrix.arch }} on ${{ matrix.runner }}"
            echo
            echo "| | bytes | |"
            echo "|---|---|---|"
            echo "| cpvm.raw | $raw | $(mib "$raw") |"
            echo "| cpvm.raw.zst (-3, the artifact) | $zst | $(mib "$zst") |"
            [ -z "${zst19:-}" ] || echo "| zstd -19 | $zst19 | $(mib "$zst19") |"
            echo "| dkb/kernel | $(stat -c %s "$OUT/dkb/kernel") | |"
            echo "| dkb/initrd | $(stat -c %s "$OUT/dkb/initrd") | |"
            echo
            echo '```'
            cat "$OUT/MANIFEST"
            echo "roothash: $(tr ' ' '\n' <"$OUT/dkb/kernel.cmdline" | sed -n 's/^roothash=//p')"
            head -1 "$OUT/packages.txt"
            echo "initramfs modules: $(tr '\n' ' ' <"$OUT/initramfs-modules.txt")"
            echo "partition types: $(sed -n 's/.*type=\([0-9A-F-]*\).*name="\([^"]*\)".*/\2=\1/p' "$REPORT/partitions.txt" | tr '\n' ' ')"
            echo
            cat "$REPORT/sha256sums.txt"
            echo
            cat "$REPORT/kernel-file.txt"
            echo '```'
            echo
            echo "<details><summary>packages</summary>"
            echo
            echo '```'; tail -n +2 "$OUT/packages.txt"; echo '```'
            echo "</details>"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: alpine-report-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpine-image-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/out/ci/cpvm.raw.zst
            ${{ runner.temp }}/out/ci/dkb/
          retention-days: 3
          compression-level: 0

      # Direct kernel boot as Lima does it, with a minimal cidata and no
      # state disk (spike/checks/image/smoke.sh). Allowed to fail: under
      # emulation on arm64 a slow runner can time it out.
      - name: Boot smoke test
        if: matrix.arch == 'x86_64' || github.event_name == 'push' || inputs.arm64_smoke
        continue-on-error: true
        timeout-minutes: 20
        run: |
          spike/checks/image/qemu-host.sh
          spike/checks/image/smoke.sh alpine "$OUT" "$REPORT"

      # Boots of changed copies (spike/checks/image/tamper.py), each of
      # which must end in a kernel panic after its own refusal line on the
      # console: the regression test of the root of trust, so a failure
      # fails the job. x86_64 under KVM only (2-8 s a boot).
      - name: Tamper boots
        if: matrix.arch == 'x86_64'
        timeout-minutes: 20
        env:
          KINDS: start mid hashblock salt alg version dbs salt0 salt300 nb50 nb+1 nb+4096 guid p1shift p1shrink p2overlap p2shrink gptbackup mbr roothash rh-guid rh-none rh-empty rh-short rh-upper rh-dup cidata-none cidata-two
        run: |
          command -v qemu-system-x86_64 >/dev/null || spike/checks/image/qemu-host.sh
          rc=0
          for w in $KINDS; do spike/checks/image/smoke.sh alpine "$OUT" "$REPORT" "$w" || rc=1; done
          exit $rc

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: alpine-boot-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report/serial-*.log
          if-no-files-found: ignore
