name: alpine-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - spike/alpine/**
      - .github/workflows/alpine-image.yml

permissions:
  contents: read

concurrency:
  group: alpine-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner
        run: |
          echo "OUT=$RUNNER_TEMP/out/ci" >>"$GITHUB_ENV"
          echo "REPORT=$RUNNER_TEMP/report" >>"$GITHUB_ENV"
          command -v zstd >/dev/null && command -v sfdisk >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd fdisk; }
          uname -a
          nproc; free -h; df -h / "$RUNNER_TEMP"
          ls -l /dev/kvm || echo "no /dev/kvm"
          docker version --format '{{.Server.Version}} {{.Server.Arch}}'

      # The variant measured end to end: Alpine's Docker, Lima's needs, dm-verity.
      - name: Build (spike/alpine/build.sh ci apk lima noctrd verity)
        env:
          CPVM_ENGINE: docker
        run: |
          OUT=$RUNNER_TEMP/out spike/alpine/build.sh ci apk lima noctrd verity

      - name: Report
        run: |
          mkdir -p "$REPORT"
          cp "$OUT"/MANIFEST "$OUT"/packages.txt "$OUT"/initramfs-modules.txt "$OUT"/dkb/kernel.cmdline "$REPORT"/
          zstd -19 -T0 -q -o "$OUT/cpvm.raw.zst" "$OUT/cpvm.raw"
          (cd "$OUT" && sha256sum cpvm.raw cpvm.raw.zst dkb/*) >"$REPORT/sha256sums.txt"
          file -L "$OUT"/dkb/kernel "$OUT"/dkb/initrd >"$REPORT/kernel-file.txt"
          sfdisk -d "$OUT/cpvm.raw" >"$REPORT/partitions.txt"
          raw=$(stat -c %s "$OUT/cpvm.raw"); zst=$(stat -c %s "$OUT/cpvm.raw.zst")
          mib() { echo "$(( ($1 + 524288) / 1048576 )) MiB"; }
          {
            echo "## ${{ matrix.arch }} on ${{ matrix.runner }}"
            echo
            echo "| | bytes | |"
            echo "|---|---|---|"
            echo "| cpvm.raw | $raw | $(mib "$raw") |"
            echo "| cpvm.raw.zst (-19) | $zst | $(mib "$zst") |"
            echo "| dkb/kernel | $(stat -c %s "$OUT/dkb/kernel") | |"
            echo "| dkb/initrd | $(stat -c %s "$OUT/dkb/initrd") | |"
            echo
            echo '```'
            cat "$OUT/MANIFEST"
            echo "roothash: $(tr ' ' '\n' <"$OUT/dkb/kernel.cmdline" | sed -n 's/^roothash=//p')"
            head -1 "$OUT/packages.txt"
            echo "initramfs modules: $(tr '\n' ' ' <"$OUT/initramfs-modules.txt")"
            echo "partition types: $(sed -n 's/.*type=\([0-9A-F-]*\).*name="\([^"]*\)".*/\2=\1/p' "$REPORT/partitions.txt" | tr '\n' ' ')"
            echo
            cat "$REPORT/sha256sums.txt"
            echo
            cat "$REPORT/kernel-file.txt"
            echo '```'
            echo
            echo "<details><summary>packages</summary>"
            echo
            echo '```'; tail -n +2 "$OUT/packages.txt"; echo '```'
            echo "</details>"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: alpine-report-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpine-image-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/out/ci/cpvm.raw.zst
            ${{ runner.temp }}/out/ci/dkb/
          retention-days: 3
          compression-level: 0

      # Direct kernel boot as Lima does it, without Lima: no cidata and no
      # state disk. Expected: cpstate finds no state disk and carries on;
      # lima-init fails at once (no cidata), and with it sshd (rc_need
      # lima-init: no sshd before the Lima user exists) and lima-boot.
      # Pass: the verity root mounted (the initramfs switches root only then),
      # Docker started, OpenRC through the default runlevel (getty on hvc0).
      - name: Boot smoke test
        continue-on-error: true
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq
          if [ "${{ matrix.arch }}" = aarch64 ]; then
            sudo apt-get install -y -qq --no-install-recommends qemu-system-arm >/dev/null
          else
            sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 >/dev/null
          fi
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then accel=kvm; else accel=tcg; fi
          if [ "${{ matrix.arch }}" = aarch64 ]; then
            qemu=qemu-system-aarch64 machine=virt early=earlycon
            [ $accel = kvm ] && cpu=host || cpu=max,pauth-impdef=on
            wait=900
          else
            qemu=qemu-system-x86_64 machine=q35 early=earlycon=uart8250,io,0x3f8
            [ $accel = kvm ] && cpu=host || cpu=max
            wait=300
          fi
          echo "accel: $accel" | tee -a "$GITHUB_STEP_SUMMARY"
          log=$REPORT/serial-hvc0.log early_log=$REPORT/serial-early.log
          : >"$log"
          start=$(date +%s)
          $qemu -machine $machine,accel=$accel -cpu $cpu -smp 2 -m 2048 \
            -display none -monitor none -no-reboot \
            -kernel "$OUT/dkb/kernel" -initrd "$OUT/dkb/initrd" \
            -append "$(cat "$OUT/dkb/kernel.cmdline") $early keep_bootcon" \
            -drive if=none,id=img,file="$OUT/cpvm.raw",format=raw,readonly=on -device virtio-blk-pci,drive=img \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0,romfile= \
            -device virtio-serial-pci -chardev file,id=hvc,path="$log" -device virtconsole,chardev=hvc \
            -serial file:"$early_log" &
          pid=$!
          result=timeout
          while [ $(($(date +%s) - start)) -lt $wait ]; do
            if ! kill -0 $pid 2>/dev/null; then result=exited; break; fi
            if grep -qa 'login:' "$log"; then
              # docker's start returns before the daemon answers: give it a moment
              sleep 5
              result=pass
              grep -qaE '@@cpm [0-9.]+ switch' "$log" || result=no-switch
              grep -qaE 'Starting Docker' "$log" || result="$result,no-docker"
              # parallel services interleave their lines: match only docker's own error
              ! grep -qaE 'ERROR: docker ' "$log" || result="$result,docker-error"
              break
            fi
            sleep 2
          done
          elapsed=$(($(date +%s) - start))
          kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true
          {
            echo "### boot smoke: $result after ${elapsed} s ($accel)"
            echo '```'
            grep -ahE 'verity|device-mapper|initramfs|@@cpm|Starting|ERROR|WARNING|cpstate|lima|sshd|docker|login:|Kernel panic' "$log" "$early_log" | head -60 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ $result = pass ]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: alpine-boot-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report/serial-*.log
          if-no-files-found: ignore
