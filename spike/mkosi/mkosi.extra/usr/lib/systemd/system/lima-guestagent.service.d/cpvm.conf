# The unit next door is byte-identical to what `lima-guestagent install-systemd`
# writes (VZ, vsock 2222), pre-enabled, so Lima's 25-guestagent-base.sh finds
# it up to date and skips its daemon-reload + enable (~0.5 s), only starting
# it. The binary itself comes from cidata each boot (/usr/local is ephemeral,
# and a root-run binary must not persist on the state disk), so at boot the
# unit is skipped, not failed (a failed unit could hit its start limit).
[Unit]
ConditionPathExists=/usr/local/bin/lima-guestagent
