# systemd 257 mounts a tmpfs under /run/credentials/ for every service that
# imports credentials (journald, sysctl, tmpfiles x3, udev...), even when there
# are none. Those mounts/umounts trip PID 1's mount-event rate limit (5/s), and
# while it's tripped systemd holds back all mount jobs (here: sysinit.target's)
# until the 1 s window ends. Nothing passes credentials to this VM.
[Service]
ImportCredential=
LoadCredential=
