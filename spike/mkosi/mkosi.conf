# credproxy appliance VM image, spike: Debian trixie, dm-verity erofs root,
# tmpfs overlay on top (systemd.volatile=overlay) so stock Lima provisioning works.
[Distribution]
Distribution=debian
Release=trixie
# Architecture: the build host's (mkosi's default); per-architecture settings in mkosi.conf.d/

[Output]
Format=disk
ImageId=cpvm

[Build]
# The docker group's gid in the guest. credproxy recreates a workspace
# container when it changes; pinned so a package-list change cannot shift it.
Environment=CPVM_DOCKER_GID=102

[Content]
Bootable=yes
# no ESP: Lima boots kernel + initrd directly (VZLinuxBootLoader), roothash held host-side
Bootloader=none
# page_reporting_order=0: free page reporting (QEMU's balloon, added by credproxy
# on Linux) hands back free blocks of any size, not only 2 MiB ones
KernelCommandLine=console=hvc0 net.ifnames=0 fsck.mode=skip systemd.volatile=overlay systemd.verity_root_options=panic-on-corruption page_reporting.page_reporting_order=0
WithDocs=no
# initrd: our own minimal one (initrd/, passed with --initrd by build.sh) plus
# only the modules needed to reach the root (default: all of them, ~40 MB)
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=
    /virtio_blk\.ko
    /dm-verity\.ko
    /erofs\.ko
    /overlay\.ko
    /sha256-ssse3\.ko
    /virtio_scsi\.ko
    /sr_mod\.ko
    /isofs\.ko
Packages=
    systemd
    systemd-sysv
    docker.io
    docker-cli
    systemd-resolved
    udev
    dbus
    tzdata
    kmod
    openssh-server
    sudo
    iproute2
    ca-certificates
    procps
    netbase
    libnss-myhostname
    libpam-systemd
    e2fsprogs
    fdisk
# Dead weight in a workspace VM (~100 MB of the root): message catalogs
# (messages fall back to English), udev's hardware database (no device here needs it;
# systemd-hwdb-update is masked), and containerd's v1 shims and its `ctr`
# CLI (dockerd uses only the runc v2 shim and talks to containerd's API).
RemoveFiles=
    /usr/share/locale/*
    /usr/lib/udev/hwdb.bin
    /usr/lib/udev/hwdb.d
    /usr/bin/ctr
    /usr/bin/containerd-shim
    /usr/bin/containerd-shim-runc-v1
