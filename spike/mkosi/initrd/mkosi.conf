# Minimal initrd for the cpvm image (built by build.sh, passed to the main build
# with --initrd): only what's needed to open the dm-verity erofs root and put
# the tmpfs overlay on it. Kernel modules come from the main build's
# kernel-modules initrd (KernelModulesInitrdInclude= in ../mkosi.conf).
# Based on mkosi's default mkosi-initrd config, minus lvm2, btrfs/xfs/vfat/ext4
# tools, networkd, hwdb, perl.
[Distribution]
Distribution=debian
Release=trixie
# Architecture: the build host's (mkosi's default); per-architecture settings in mkosi.conf.d/

[Output]
Format=cpio
Output=initrd
ManifestFormat=
SplitArtifacts=

[Content]
Bootable=no
MakeInitrd=yes
CleanPackageMetadata=yes
WithDocs=no
Locale=C.UTF-8
Packages=
    systemd
    udev
    kmod
    dmsetup
    libcryptsetup12
    systemd-cryptsetup
RemovePackages=
    dpkg
RemoveFiles=
    /usr/lib/systemd/catalog
    /etc/udev/hwdb.d
    /usr/lib/udev/hwdb.d
    /usr/lib/udev/hwdb.bin
    /etc/services
    /usr/lib/modules/*/vmlinuz*
    /usr/lib/modules/*/vmlinux*
    /usr/lib/modules/*/System.map
    /var/cache
    /var/log
    /usr/share/locale/*
    /usr/share/doc
    /usr/share/zoneinfo
    /usr/lib/x86_64-linux-gnu/gconv
    /usr/bin/perl*
    /usr/lib/x86_64-linux-gnu/perl-base
