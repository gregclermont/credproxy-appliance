# load right away instead of waiting for udev coldplug to request them
virtio_blk
dm_verity
sha256_ssse3
erofs
overlay
# QEMU's cidata CD-ROM (virtio-scsi): probed while the initrd sets up the
# root, so lima-init (and sshd after it) need not wait for the main system's
# udev to load these from the verity root. VZ has no SCSI controller.
virtio_scsi
sr_mod
isofs
