# Alpine's 00-alpine.conf reboots 120 s after a panic; a panic here means
# the root failed verification or the VM could not come up, and must leave
# it down for the host to see, not reboot into another attempt.
kernel.panic = 0
# As Debian (systemd's 50-pid-max.conf and its fs.file-max at boot).
kernel.pid_max = 4194304
fs.file-max = 9223372036854775807
# File watchers of large projects (editors, bundlers, test runners): the
# default (~16k on 2 GiB) runs out; a limit, not an allocation.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
# Debuggers and profilers attach to running processes (gdb -p, strace -p),
# as on Debian; the workspace's processes are all the user's anyway.
kernel.yama.ptrace_scope = 0
